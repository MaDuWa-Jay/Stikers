name: Build sticker packs

on:
  push:
    branches: [main]
    paths: ["packs.txt", "tools/**", ".github/workflows/build-packs.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ffmpeg + lottie
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libcairo2
          pip install pillow "lottie[all]"

      - name: Convert packs
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          python3 tools/build_all.py --packs packs.txt --out site \
            --base-url "https://${OWNER}.github.io/${{ github.event.repository.name }}"

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
